    <script>
      // Defensive shim for third-party browser extensions attempting to assign window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchVal = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return fetchVal; },
            set: function(newVal) { fetchVal = newVal; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if environment prohibits property redefinition
        }
      })();
